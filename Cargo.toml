[workspace]
members = [
    "catalogs/iceberg-file-catalog",
    "catalogs/iceberg-glue-catalog",
    "catalogs/iceberg-rest-catalog",
    "catalogs/iceberg-s3tables-catalog",
    "catalogs/iceberg-sql-catalog",
    "datafusion-iceberg-sql",
    "datafusion_iceberg",
    "iceberg-rust",
    "iceberg-rust-spec",
]

resolver = "2"

[workspace.dependencies]
apache-avro = "0.21"
arrow = "60"
arrow-schema = "60"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = [
    "serde",
    "clock",
] }
crc32fast = "1.4"
datafusion = "56.0.0-dev"
datafusion-common = "56.0.0-dev"
datafusion-execution = "56.0.0-dev"
datafusion-expr = "56.0.0-dev"
datafusion-functions = { version = "56.0.0-dev", features = ["crypto_expressions"] }
datafusion-functions-aggregate = "56.0.0-dev"
datafusion-sql = "56.0.0-dev"
derive-getters = "0.5.0"
derive_builder = "0.20"
futures = "0.3.31"
fastnum = { version = "0.7", default-features = false, features = ["std", "serde"] }
getrandom = { version = "0.4.2", features = ["std"] }
itertools = "0.14.0"
lru = "0.18.0"
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
murmur3 = { version = "0.5.2" }
parquet = { version = "60", features = ["async", "object_store"] }
pin-project-lite = "0.2"
regex = "1.11.1"
roaring = "0.11"
serde = "^1.0"
serde_derive = "^1.0"
serde_json = "^1.0"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tracing = "0.1"
url = "^2.5"
uuid = { version = "1.23.1", features = ["serde", "v4"] }

# TODO: drop once datafusion 56 is released to crates.io
[patch.crates-io]
datafusion = { git = "https://github.com/apache/datafusion", branch = "branch-56" }
datafusion-catalog = { git = "https://github.com/apache/datafusion", branch = "branch-56" }
